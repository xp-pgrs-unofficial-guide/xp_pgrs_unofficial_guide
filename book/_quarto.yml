project:
  type: book
  output-dir: _book
  resources:
  - assets/guide.js
  - assets/imported/**
book:
  title: 西浦博士生非官方攻略
  subtitle: 从入学到毕业，分享亲历的经验
  author: 指南编辑与供稿者
  output-file: xp-pgrs-unofficial-guide
  site-url: https://xp-pgrs-unofficial-guide.github.io/xp_pgrs_unofficial_guide/
  repo-url: https://github.com/xp-pgrs-unofficial-guide/xp_pgrs_unofficial_guide
  repo-branch: main
  repo-subdir: book
  repo-actions:
  - source
  downloads:
  - pdf
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
  - index.qmd
  - part: 学业
    contents:
    - section: 培养要求与考核
      contents:
      - content/academic/compulsory-courses.qmd
      - content/academic/meeting-records.qmd
      - content/academic/apr.qmd
      - content/academic/research-symposium.qmd
      - content/academic/ta-obligations.qmd
    - section: 学位论文与毕业
      contents:
      - content/academic/graduation.qmd
      - content/academic/thesis.qmd
      - content/academic/viva.qmd
      - content/academic/degree-documents.qmd
    - section: 学籍与证明
      contents:
      - content/academic/student-status.qmd
  - part: 资源
    contents:
    - section: 常用入口与校园办事
      contents:
      - content/resources/start-here.qmd
      - content/resources/campus-map.qmd
      - content/resources/contacts.qmd
    - section: 账号与数字服务
      contents:
      - content/resources/campus-it.qmd
      - content/resources/liverpool-account.qmd
      - content/resources/remote-access.qmd
      - content/resources/recommended-software.qmd
    - section: 图书馆与文献
      contents:
      - content/resources/library-databases.qmd
      - content/resources/suzhou-library.qmd
      - content/resources/uk-library-access.qmd
    - section: 经费与校园福利
      contents:
      - content/resources/conference-funding.qmd
      - content/resources/stationery.qmd
      - content/resources/printing.qmd
      - content/resources/sports-vouchers.qmd
  - part: 研究
    contents:
    - section: 科研入门
      contents:
      - content/research/how-research-works.qmd
    - section: 资料与数据管理
      contents:
      - content/research/backup.qmd
    - section: 学术交流与访学
      contents:
      - content/research/liverpool-visit.qmd
      - content/research/liverpool-preparation.qmd
      - content/research/liverpool-life.qmd
    - section: 研究方法与论文发表
      contents:
      - content/research/methods-and-publishing.qmd
  - part: 工作
    contents:
    - section: 助教与教学支持
      contents:
      - content/work/teaching-assistant.qmd
      - content/work/marking.qmd
      - content/work/invigilation.qmd
    - section: 职业发展
      contents:
      - content/work/career-development.qmd
  - part: 生活
    contents:
    - section: 身心健康
      contents:
      - content/life/ergonomics.qmd
      - content/life/mental-health.qmd
    - section: 日常生活
      contents:
      - content/life/everyday-life.qmd
    - section: 运动与娱乐
      contents:
      - content/life/sports-and-leisure.qmd
  - part: 社交
    contents:
    - content/social/overview.qmd
  - part: 关于本指南
    contents:
    - content/about/preface.qmd
    - content/about/contributing.qmd
    - content/about/join-us.qmd
    - content/about/acknowledgements.qmd
    - content/about/changelog.qmd
  - part: 作者与贡献者
    contents:
    - authors/kai-wu.qmd
    - authors/shiyao-zhang.qmd
    - authors/yue-zhou.qmd
    - authors/ziwen-xie.qmd
    - authors/jialin-wang.qmd
    - authors/editorial.qmd
    - authors/unknown.qmd
lang: zh-CN
metadata-files:
- _authors.yml
- _updates.generated.yml
filters:
- filters/author-pages.lua
- filters/updates.lua
- filters/attribution.lua
- filters/publishing.lua
guide-repo: https://github.com/xp-pgrs-unofficial-guide/xp_pgrs_unofficial_guide
guide-site: https://xp-pgrs-unofficial-guide.github.io/xp_pgrs_unofficial_guide/
comments: false
toc: true
number-sections: false
link-external-newwindow: true
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/guide.css
    toc-title: 本页内容
    toc-expand: true
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    respect-user-color-scheme: true
  pdf:
    documentclass: ctexbook
    classoption:
    - UTF8
    - fontset=fandol
    - oneside
    - openany
    pdf-engine: xelatex
    latex-auto-install: false
    papersize: a4
    fontsize: 12pt
    geometry:
    - top=25.4mm
    - bottom=25.4mm
    - left=20mm
    - right=20mm
    - headheight=28pt
    - headsep=4mm
    - footskip=12mm
    colorlinks: true
    link-citations: true
    keep-tex: false
    include-in-header: pdf/style.tex
    number-sections: true
    template-partials:
    - pdf/before-body.tex
guide-language: zh-CN
guide-source-prefix: ''
guide-site-root: https://xp-pgrs-unofficial-guide.github.io/xp_pgrs_unofficial_guide/
