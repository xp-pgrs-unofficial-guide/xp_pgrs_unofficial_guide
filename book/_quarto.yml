project:
  type: book
  output-dir: _book
  resources:
    - assets/guide.js
    - assets/imported/**

book:
  title: 西浦博士生非官方攻略
  subtitle: 从入学到毕业，分享亲历的经验
  author: 指南编辑与供稿者
  output-file: xp-pgrs-unofficial-guide
  site-url: https://xp-pgrs-unofficial-guide.github.io/xp_pgrs_unofficial_guide/
  repo-url: https://github.com/xp-pgrs-unofficial-guide/xp_pgrs_unofficial_guide
  repo-branch: main
  repo-subdir: book
  repo-actions: [edit, issue, source]
  downloads: [pdf]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - content/preface.qmd
    - part: 开始之前
      chapters:
        - content/start-here.qmd
    - part: 毕业必经之路
      chapters:
        - content/compulsory-courses.qmd
        - content/meeting-records.qmd
        - content/apr.qmd
        - content/research-symposium.qmd
    - part: 资源与福利
      chapters:
        - content/conference-funding.qmd
        - content/stationery.qmd
        - content/printing.qmd
        - content/sports-vouchers.qmd
        - content/liverpool-account.qmd
        - content/other-benefits.qmd
    - part: 研究与工作
      chapters:
        - content/how-research-works.qmd
        - content/teaching-assistant.qmd
        - content/invigilation.qmd
        - content/thesis-and-graduation.qmd
        - content/career.qmd
    - part: 生活与工具
      chapters:
        - content/backup.qmd
        - content/remote-access.qmd
        - content/ergonomics.qmd
        - content/liverpool-visit.qmd
        - content/campus-vm.qmd
        - content/library-databases.qmd
        - content/suzhou-library.qmd
        - content/mental-health.qmd
        - content/recommended-software.qmd
        - content/pitfalls.qmd
    - part: 附录与参与
      chapters:
        - content/campus-map.qmd
        - content/contacts.qmd
        - content/join-us.qmd
        - contributing.qmd
        - content/acknowledgements.qmd
        - content/changelog.qmd

lang: zh-CN
metadata-files: [_authors.yml]
filters:
  - filters/attribution.lua
  - filters/publishing.lua
guide-repo: https://github.com/xp-pgrs-unofficial-guide/xp_pgrs_unofficial_guide
guide-site: https://xp-pgrs-unofficial-guide.github.io/xp_pgrs_unofficial_guide/
comments: false
toc: true
number-sections: false
link-external-newwindow: true

format:
  html:
    theme: cosmo
    css: assets/guide.css
    toc-title: 本页内容
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
  pdf:
    documentclass: ctexbook
    classoption: [UTF8, fontset=fandol, oneside, openany]
    pdf-engine: xelatex
    latex-auto-install: false
    papersize: a4
    fontsize: 11pt
    geometry: [margin=24mm]
    colorlinks: true
    link-citations: true
    keep-tex: false
    include-in-header:
      text: |
        \usepackage{xeCJKfntef}
        \providecommand{\st}[1]{#1}
        \renewcommand{\st}[1]{\sout{#1}}
        \providecommand{\ul}[1]{#1}
        \renewcommand{\ul}[1]{\uline{#1}}
